[general]
; Enable the touchscreen input.
touch = true

; Enable touchpad input (relative pointer, as on some rotary-controller HUs).
touchpad = false

; When touchpad = true: enable touchpad-driven navigation gestures.
;touchpadnavigation = false

; When touchpad = true: tapping the touchpad acts as "select" (like a click).
;touchpadtapasselect = false

; Enable a rotary/directional controller (dpad-style) input, as used on
; non-touch head units (e.g. older Sensus, iDrive, COMAND).
controller = false

; Input mode override: touch|rotary|hybrid|default. Usually left unset;
; the touch/touchpad/controller booleans above already select the mode.
;inputmode = default

; Main display resolution, WxH. Officially listed: 800x480, 1280x720,
; 1920x1080. Swapping width/height (e.g. 720x1280, 1080x1920) renders a
; portrait display, confirmed supported by the DHU binary's resolution
; whitelist. Set to match your head unit's actual screen.
resolution = 1280x720

; Screen density in DPI.
dpi = 160

; Video framerate advertised to the phone.
framerate = 30

; Horizontal black-bar margin in pixels (alternative to `margins` below).
;marginwidth = 0

; Vertical black-bar margin in pixels (alternative to `margins` below).
;marginheight = 0

; Combined margins as "top,bottom,left,right", overrides marginwidth/height.
;margins = 0,0,0,0

; Content insets (safe-area padding) as "top,bottom,left,right".
;contentinsets = 0,0,0,0

; Stable content insets (safe-area padding that ignores transient UI like
; the keyboard) as "top,bottom,left,right".
;stablecontentinsets = 0,0,0,0

; Crop the decoded frame to the margins instead of just padding around it.
;cropmargins = false

; Emulate a secondary instrument-cluster display alongside the main screen.
instrumentcluster = false

; Emulate a secondary navigation-only cluster display.
;navcluster = false

; Emulate a secondary phone/call cluster display.
;phonecluster = false

; Show current media playback status/controls in the DHU window.
;playbackstatus = false

; Driver seating position: left|center|right. Affects some UI mirroring.
;driverposition = left

; Comma-separated fuel types reported to the phone (e.g. unleaded,diesel).
;fueltypes = unleaded

; Comma-separated EV connector types reported to the phone (e.g. supercharger).
;evconnectors =

[sensors]
; GPS location sensor.
location = true

; Night mode (day/night UI theme) sensor.
night_mode = true

; Driving status sensor (parked/moving), used for driving-restriction rules.
driving_status = true

; Fuel level sensor.
;fuel = false

; Odometer sensor.
;odometer = false

; Vehicle speed sensor.
;speed = false

; Toll card presence sensor.
;toll_card = false

; Accelerometer sensor.
;accelerometer = false

; Gyroscope sensor.
;gyroscope = false

; Compass/magnetometer sensor.
;compass = false

; GPS satellite data sensor.
;gps_satellite = false

; Parking brake status sensor.
;parking_brake = false

; Gear position sensor.
;gear = false
